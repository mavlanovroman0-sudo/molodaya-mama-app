# HomeEase 2.0 — production Docker Compose
#
# Подготовка:
#   1. cp backend/.env.example backend/.env.production
#   2. Заполните секреты (openssl rand -hex 32), APP_ENV=production, CORS_ORIGINS, YooKassa
#   3. docker compose -f docker-compose.prod.yml --env-file backend/.env.production build
#   4. docker compose -f docker-compose.prod.yml --env-file backend/.env.production up -d
#   5. Миграции: docker compose -f docker-compose.prod.yml exec backend bash scripts/migrate.sh
#
# SSL: см. docs/nginx-homeease.example.conf и README.md

name: homeease-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: homeease-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-homeease}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeease}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: homeease-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: homeease-backend:prod
    container_name: homeease-prod-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-homeease}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homeease}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SUBSCRIPTION_ENFORCE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_internal
      - frontend_edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        EXPO_PUBLIC_API_URL: https://my-molodaya-mama.ru
    image: homeease-frontend:prod
    container_name: homeease-prod-frontend
    restart: unless-stopped
    networks:
      - frontend_edge
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: homeease-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs/nginx-homeease.example.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - frontend_edge
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  backend_internal:
    internal: true
  frontend_edge:
    driver: bridge
