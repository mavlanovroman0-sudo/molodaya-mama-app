# Пример конфигурации nginx для HomeEase 2.0 (production)
#
# 1. Замените YOUR_DOMAIN на ваш домен (например app.homeease.ru)
# 2. Получите SSL-сертификат Let's Encrypt:
#      certbot certonly --standalone -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#    Или используйте Traefik / Caddy с автоматическим HTTPS
# 3. Скопируйте сертификаты в docs/ssl/:
#      fullchain.pem, privkey.pem
# 4. Перезапустите: docker compose -f docker-compose.prod.yml restart nginx
#
# API: https://YOUR_DOMAIN/api/v1/...
# Webhook YooKassa: https://YOUR_DOMAIN/api/v1/webhook/yookassa

upstream homeease_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Редирект на HTTPS (раскомментируйте после настройки SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://homeease_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

