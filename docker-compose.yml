# Запуск: docker compose -p homeease up -d --build
# (флаг -p обязателен при кириллическом пути к проекту)

services:
  postgres:
    image: postgres:16-alpine
    container_name: homeease-postgres
    environment:
      POSTGRES_USER: homeease
      POSTGRES_PASSWORD: homeease_dev
      POSTGRES_DB: homeease
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeease"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homeease-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeease-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://homeease:homeease_dev@postgres:5432/homeease
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      APP_ENV: development
      ENABLE_SCHEDULER: "false"
      SUBSCRIPTION_ENFORCE: "false"
      CORS_ORIGINS: "http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:8083,http://localhost:8083"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./i18n:/app/i18n_locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homeease-frontend
    ports:
      - "8081:8081"
      - "19006:19006"
    environment:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npx expo start --web --port 8081 --host lan

  ble-service:
    build:
      context: ./ble-service
      dockerfile: Dockerfile
    container_name: homeease-ble
    ports:
      - "8100:8100"
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
