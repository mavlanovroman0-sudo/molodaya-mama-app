server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }

    location = /subscription/success {
        try_files /subscription/success/index.html =404;
    }

    location = /subscription/cancel {
        try_files /subscription/cancel/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
