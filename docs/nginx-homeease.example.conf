# HomeEase 2.0 — nginx production
# Сайт: frontend. API: /api /health

upstream homeease_backend {
    server backend:8000;
    keepalive 32;
}

upstream homeease_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name my-molodaya-mama.ru www.my-molodaya-mama.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my-molodaya-mama.ru www.my-molodaya-mama.ru;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /health {
        proxy_pass http://homeease_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://homeease_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://homeease_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
